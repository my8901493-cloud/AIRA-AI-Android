name: AIRA AI Android CI & Debug APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit Tests & Debug APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AIRA-AI-Android Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit & Voice Pipeline Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload AIRA AI Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRA-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
